<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>

    <!-- Fonte Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

    <style>
        :root {
            --brand-dark: #0f2027;
            --brand-mid: #203a43;
            --brand-soft: #2c5364;
            --accent: #25d366;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--brand-dark), var(--brand-mid), var(--brand-soft));
            margin: 0;
            padding: 0;
            color: #fff;
        }

        /* Navbar */
        .site-navbar {
            backdrop-filter: blur(14px);
            background: rgba(15,32,39,0.85);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            z-index: 1200;
            position: fixed;
            top: 0; left: 0; right: 0;
        }
        .site-navbar .navbar-brand {
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.5px;
        }
        .site-navbar .nav-link {
            color: rgba(255,255,255,0.85);
            font-weight: 600;
            padding: .65rem .9rem;
        }
        .site-navbar .nav-link:hover,
        .site-navbar .nav-link.active {
            color: #fff;
            border-bottom: 2px solid var(--accent);
        }

        .site-wrapper {
            padding-top: 80px;
        }

        /* HERO */
        .hero-section {
            width: 100%;
            min-height: 100vh;
            background: url("{{ url_for('static', filename='imagem/hero.png') }}") no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            position: relative;
            border-radius: 0;
        }
        .hero-overlay {
            position: absolute;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.5);
        }
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 900px;
        }
        .hero-content h1 {
            font-size: 3.5rem;
            font-weight: 800;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
        }
        .hero-content p {
            font-size: 1.2rem;
        }

        /* Galeria */
        .gallery {
            padding: 60px 20px;
        }
        .gallery img {
            border-radius: 12px;
            width: 100%;
            height: 300px;
            object-fit: cover;
            transition: transform .3s ease, box-shadow .3s ease;
        }
        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        }

        /* Footer */
        footer.site-footer {
            background: transparent;
            color: #fff;
            padding: 30px 0;
        }
        .site-footer a {
            color: #fff;
            margin: 0 10px;
            font-size: 1.5rem;
            transition: color .3s ease;
        }
        .site-footer a:hover {
            color: var(--accent);
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .hero-content h1 {
                font-size: 2rem;
            }
            .hero-content p {
                font-size: 1rem;
            }
            .gallery img {
                height: 220px;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg site-navbar">
        <div class="container">
            <a class="navbar-brand" href="/">MedidaWeb</a>
            <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <i class="bi bi-list"></i>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="/sobre">Sobre</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo -->
    <div class="site-wrapper">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="site-footer text-center">
        <div class="mb-3">
            <a href="https://github.com/VitorGoldner" target="_blank"><i class="bi bi-github"></i></a>
            <a href="https://www.linkedin.com/in/vitorgoldner" target="_blank"><i class="bi bi-linkedin"></i></a>
        </div>
        <small>&copy; {{ 2025 }} MedidaWeb. Todos os direitos reservados.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
